name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: 'src/PvZRSkinTools'
    steps:
      - uses: actions/checkout@v7

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version-file: src/PvZRSkinTools/.python-version

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Sync dependencies
        run: uv sync --locked

      - name: "Set up Node.js"
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install npm dependencies
        run: npm --prefix ./node-tools install

      - name: Run build
        shell: bash
        run: ./build.sh

      - name: Zip build output
        shell: pwsh
        run: |
          Compress-Archive -Path build/PvZRSkinTools/* -DestinationPath ${{ github.workspace }}/PvZRSkinTools-${{ github.ref_name }}.zip
 
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ github.workspace }}/PvZRSkinTools-${{ github.ref_name }}.zip
