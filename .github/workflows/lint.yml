name: Lint

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'src/PvZRSkinTools'

    steps:
      - uses: actions/checkout@v7
      
      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version-file: src/PvZRSkinTools/.python-version

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Sync dev dependencies
        run: uv sync --locked --only-group dev

      - name: Run lint
        run: ./lint.sh
