[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=9.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
root = "../.."

[tool.uv]
required-version = ">=0.12.18"

[project]
name = "pvzrskintools"
dynamic = ["version"]
requires-python = ">=3.13"
dependencies = [
    "inquirerpy>=0.3.4",
    "pyperclip>=1.11.0",
    "rich>=15.0.0",
    "spineatlas>=1.0.13",
    "unitypy>=1.25.3",
]

[dependency-groups]
dev = [
    "nuitka>=4.2.2",
    "packaging>=26.3",
    "pip-licenses>=5.5.5",
    "pylint>=4.0.8",
    "ruff>=0.16.8",
]
