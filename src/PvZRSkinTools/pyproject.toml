[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=9.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
root = "../.."

[project]
name = "pvzrskintools"
dynamic = ["version"]
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "inquirerpy>=0.3.4",
    "pyperclip>=1.11.0",
    "rich>=15.0.0",
    "spineatlas>=1.0.13",
    "unitypy>=1.25.0",
]

[dependency-groups]
dev = [
    "nuitka>=4.1.3",
    "packaging>=26.2",
    "pip-licenses>=5.5.5",
    "pylint>=4.0.6",
    "ruff>=0.15.20",
]
